<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyecto Jose</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <!-- input && bottom-->
    <div class="w-50 mx-auto my-3">
        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="New note content" aria-label="Recipient’s username"
                aria-describedby="button-addon2" id="Data-input">
            <button class="btn btn-primary" type="button" id="button-addon2">create</button>
        </div>
    </div>
    <!-- list-->
    <div class="w-50 mx-auto">
        <ul class="list-group" id="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="form-check mx-2">
                        <input class="form-check-input" type="checkbox" value="" id="checkbox">
                    </div>
                    <span class="ms-1">An item example</span>
                </div>
                <!-- Button trigger modal -->
                <button type="button" class="btn btn-danger" id="Delete-button" data-bs-toggle="modal"
                    data-bs-target="#DeleteElementModal">Delete</button>
            </li>
            <li class="list-group-item ms-auto bg-primary add-note-row">
                <button type="button" class="text-white bg-transparent border-0 add-note-trigger">add a new
                    note</button>
            </li>
        </ul>
    </div>


    <!-- Modal -->
    <div class="modal fade" id="DeleteElementModal" tabindex="-1" aria-labelledby="exampleModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Would you like to <span
                            class="text-danger">delete the note</span>?</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    If you delete this note, it will be permanently removed from the list.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-confirm" data-bs-dismiss="modal">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../backend/backend.js" type="module"></script>
</body>

</html>
